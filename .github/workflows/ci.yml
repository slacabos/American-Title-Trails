name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request replaces a running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, types, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npm run lint
      # The AI balance simulation is left out: the Hard and Expert AIs search
      # on a time budget, so on slow shared runners it measures the machine.
      # Run it locally with `npm run test:ai-sim` when tuning the AI.
      - run: npx vitest run --exclude src/test/ai.sim.test.ts
      - run: npm run build

  browser:
    name: Stories and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Storybook stories in Chromium
        run: npx vitest run --config vite.config.ts --project storybook
      # WebGL runs on SwiftShader (see playwright.config.ts), so no GPU is needed.
      - name: Playwright end-to-end tests
        run: npm run test:browser
      - name: Keep failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
